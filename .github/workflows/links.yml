name: Weekly link check

on:
  schedule:
    # Fridays ~05:17 UTC (off-peak minute to avoid scheduled-cron congestion)
    - cron: "17 5 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Scan all markdown with lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress README.md "**/*.md"
          output: lychee-report.json
          format: json
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build issue body
        id: report
        env:
          LYCHEE_EXIT: ${{ steps.lychee.outputs.exit_code }}
        run: |
          set -euo pipefail
          # lychee's own exit codes (lychee-bin/src/main.rs ExitCode):
          # 0 = success, 2 = broken links found. 1 = catch-all tool failure,
          # 3 = unparsable lychee.toml; both leave no usable report.
          case "$LYCHEE_EXIT" in
            0 | 2) ;;
            *) echo "::error::lychee itself failed (exit ${LYCHEE_EXIT:-none}); no report to parse. Exit 1 = tool error, exit 3 = lychee.toml uses keys this lychee version rejects."
               exit 1 ;;
          esac
          python scripts/test_links_issue_body.py
          state="$(CHECK_DATE="$(date -u +%F)" python scripts/links_issue_body.py lychee-report.json broken-links-report.md)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Link check state: $state"

      - name: Sync broken-links issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          state="${{ steps.report.outputs.state }}"
          if [ "$state" = "unknown" ]; then
            echo "::error::Link report missing, unreadable, or schema-drifted. Issues left untouched."
            exit 1
          fi
          gh label create broken-links --color "B60205" \
            --description "URLs reported unreachable by the weekly CI link check" \
            --force 2>/dev/null || true
          open="$(gh issue list --label broken-links --state open --json number \
            --jq '[.[].number] | join(" ")')"
          if [ "$state" = "broken" ]; then
            for n in $open; do
              gh issue close "$n" --comment "Superseded by the latest weekly link report."
            done
            gh issue create --label broken-links \
              --title "Broken links — $(date -u +%F)" \
              --body-file broken-links-report.md
          elif [ -n "$open" ]; then
            for n in $open; do
              gh issue close "$n" --comment "Weekly check found all links healthy — closing automatically."
            done
          fi

  metadata:
    name: Refresh star and freshness data
    runs-on: ubuntu-latest
    needs: check
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch GitHub repository metadata
        run: python scripts/resource_meta.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/resources-meta.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(links): refresh resource metadata"
            git push
          else
            echo "Metadata unchanged."
          fi
